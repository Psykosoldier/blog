baseURL = "https://psykosoldier.github.io/blog/"
locale = "en-us"
title = "My House Runs on an AI Agent"
theme = "PaperMod"
paginate = 10

enableRobotsTXT = true
enableEmoji = true
buildDrafts = false
buildFuture = false
buildExpired = false

[taxonomies]
  category = "categories"
  tag = "tags"

[params]
  env = "production"
  description = "Running a smart home on an AI coding agent — real incidents, real guardrails, no sanitized case studies."
  author = "Dennis"
  defaultTheme = "dark"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  ShowFullTextinRSS = true
  UseHugoToc = true
  disableSpecial1stPost = true
  disableScrollToTop = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  [params.homeInfoParams]
    Title = "My House Runs on an AI Agent"
    Content = "A blog about running Home Assistant with an AI coding agent acting as project lead — real incidents, the guardrails that came out of them, and what actually broke along the way."

  [params.assets]
    disableHLJS = true

[[menu.main]]
  identifier = "posts"
  name = "Posts"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "categories"
  name = "Categories"
  url = "/categories/"
  weight = 20

[[menu.main]]
  identifier = "tags"
  name = "Tags"
  url = "/tags/"
  weight = 30

[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    style = "monokai"
  [markup.goldmark.renderer]
    unsafe = true
